openapi: 3.0.3
info:
  title: Whiskey Log API
  version: 2.1.0
servers:
  - url: https://api.dev.whiskeybar.site
  - url: https://api.whiskeybar.site
paths:
  /api/whiskeys:
    get:
      security: []
      summary: List whiskeys
      responses:
        '200':
          description: Whiskey list
  /api/whiskeys/search:
    get:
      security: []
      summary: Search whiskeys
      parameters:
        - name: q
          in: query
          schema: {type: string}
      responses:
        '200': {description: Search results}
  /api/whiskeys/suggest:
    get:
      security: []
      summary: Suggest whiskey names
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string}
      responses:
        '200': {description: Suggestions}
  /api/whiskeys/search/suggest:
    get:
      security: []
      summary: Suggest whiskey names (compatibility route)
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string}
      responses:
        '200': {description: Suggestions}
  /api/whiskeys/ranking:
    get:
      security: []
      summary: Get whiskey rankings
      responses:
        '200': {description: Rankings}
  /api/reviews:
    get:
      security:
        - bearerAuth: []
      summary: List the authenticated user's reviews
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/NextToken'
      responses:
        '200':
          description: User review page
          headers:
            Cache-Control:
              schema: {type: string, example: 'private, no-store'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      security:
        - bearerAuth: []
      summary: Create a review
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewCreateInput'}
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Review'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {description: Daily review limit exceeded}
  /api/reviews/public:
    get:
      security: []
      summary: List public reviews
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/NextToken'
      responses:
        '200':
          description: Public review page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicReviewPage'}
  /api/reviews/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      security:
        - bearerAuth: []
      summary: Get an owned review
      responses:
        '200':
          description: Review
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Review'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      security:
        - bearerAuth: []
      summary: Update an owned review
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewUpdateInput'}
      responses:
        '200':
          description: Review updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Review'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      security:
        - bearerAuth: []
      summary: Delete an owned review
      responses:
        '204': {description: Review deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: AWS Cognito ID token; access tokens are not accepted
  parameters:
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    NextToken:
      name: next_token
      in: query
      schema: {type: string}
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: A valid Cognito ID token is required
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Review not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
        request_id: {type: string}
        fields:
          type: object
          additionalProperties: {type: string}
    Review:
      type: object
      required: [id, whiskey_id, rating, date, is_public, created_at, updated_at]
      properties:
        id: {type: string}
        whiskey_id: {type: string}
        whiskey_name: {type: string}
        whiskey_distillery: {type: string}
        user_id: {type: string, description: Returned only on authenticated owner routes}
        rating: {$ref: '#/components/schemas/Rating'}
        notes: {type: string, maxLength: 2000}
        serving_style: {$ref: '#/components/schemas/ServingStyle'}
        date: {type: string, format: date}
        is_public: {type: boolean, default: false}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ReviewPage:
      type: object
      required: [results, reviews, count]
      properties:
        results:
          type: array
          items: {$ref: '#/components/schemas/Review'}
        reviews:
          type: array
          items: {$ref: '#/components/schemas/Review'}
        count: {type: integer, minimum: 0}
        next_token: {type: string, nullable: true}
    PublicReview:
      type: object
      description: Public projection; owner and internal index identifiers are omitted
      required: [id, whiskey_id, rating, date, is_public, created_at, updated_at]
      properties:
        id: {type: string}
        whiskey_id: {type: string}
        whiskey_name: {type: string}
        whiskey_distillery: {type: string}
        rating: {$ref: '#/components/schemas/Rating'}
        notes: {type: string, maxLength: 2000}
        serving_style: {$ref: '#/components/schemas/ServingStyle'}
        date: {type: string, format: date}
        is_public: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    PublicReviewPage:
      type: object
      required: [results, reviews, count]
      properties:
        results:
          type: array
          items: {$ref: '#/components/schemas/PublicReview'}
        reviews:
          type: array
          items: {$ref: '#/components/schemas/PublicReview'}
        count: {type: integer, minimum: 0}
        next_token: {type: string, nullable: true}
    Rating:
      type: number
      minimum: 1
      maximum: 5
    ServingStyle:
      type: string
      enum: [NEAT, ROCKS, WATER, SODA, COCKTAIL]
    ReviewCreateInput:
      type: object
      additionalProperties: false
      required: [whiskey_id, rating, date]
      properties:
        whiskey_id: {type: string, minLength: 1}
        rating: {$ref: '#/components/schemas/Rating'}
        notes: {type: string, maxLength: 2000}
        serving_style: {$ref: '#/components/schemas/ServingStyle'}
        date: {type: string, format: date}
        is_public: {type: boolean, default: false}
    ReviewUpdateInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        rating: {$ref: '#/components/schemas/Rating'}
        notes: {type: string, maxLength: 2000}
        serving_style: {$ref: '#/components/schemas/ServingStyle'}
        date: {type: string, format: date}
        is_public: {type: boolean}
