name: CI / Deploy

# CI (tests, lint, typecheck, build, synth) runs on every PR and push.
# Jobs that assume the AWS OIDC role run ONLY on push to main and only after CI
# passes, so a pull request (including from a fork) can never obtain AWS
# credentials. CDK infrastructure is deployed MANUALLY via infra/scripts/deploy.sh
# (see infra/README.md); this workflow deploys only the frontend on push to main.
# prd is out of scope here: it will get its own workflow after the prd account is
# finalized. Third-party actions are pinned to commit SHAs (Dependabot keeps them
# current via .github/dependabot.yml).

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'
  AWS_REGION: ap-northeast-1

# Least privilege by default; jobs that need OIDC opt in explicitly.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # CI: no AWS credentials. Runs on PR and push.
  # ---------------------------------------------------------------------------
  ci:
    name: Test / Lint / Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # --- Lambda (Python) ---
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Lambda tests
        run: python -m pytest tests

      # --- Node toolchain (shared by infra + frontend) ---
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # --- Infrastructure (CDK) ---
      - name: Install infra dependencies
        run: npm ci
        working-directory: infra

      - name: Build infra (tsc)
        run: npm run build
        working-directory: infra

      - name: Run CDK tests
        run: npx jest
        working-directory: infra

      - name: CDK synth (dev, lookup-free)
        run: npx cdk synth -c env=dev --quiet
        working-directory: infra

      # --- Frontend (Nuxt) ---
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Typecheck frontend
        run: npm run typecheck
        working-directory: frontend

      - name: Test frontend
        run: npm run test -- --run
        working-directory: frontend

      - name: Build frontend (generate)
        run: npm run generate
        working-directory: frontend

  # ---------------------------------------------------------------------------
  # Resolve dev stack outputs. Push-only, needs CI. Assumes the OIDC role.
  # ---------------------------------------------------------------------------
  setup:
    name: Resolve dev outputs
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    outputs:
      bucket_name: ${{ steps.infra.outputs.bucket_name }}
      distribution_id: ${{ steps.infra.outputs.distribution_id }}
      user_pool_id: ${{ steps.infra.outputs.user_pool_id }}
      user_pool_client_id: ${{ steps.infra.outputs.user_pool_client_id }}
      cognito_domain: ${{ steps.infra.outputs.cognito_domain }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Setup-${{ github.run_id }}

      - name: Get WhiskeyApp-Dev outputs
        id: infra
        run: |
          set -euo pipefail
          STACK_NAME="WhiskeyApp-Dev"
          get_output() {
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }
          BUCKET_NAME=$(get_output WebAppBucketName)
          DISTRIBUTION_ID=$(get_output CloudFrontDistributionId)
          USER_POOL_ID=$(get_output UserPoolId)
          USER_POOL_CLIENT_ID=$(get_output UserPoolClientId)
          COGNITO_DOMAIN=$(get_output CognitoHostedUiHostname)
          # Cognito Hosted UI hostname must be a bare host (Amplify oauth.domain).
          COGNITO_DOMAIN=${COGNITO_DOMAIN#https://}
          COGNITO_DOMAIN=${COGNITO_DOMAIN#http://}
          COGNITO_DOMAIN=${COGNITO_DOMAIN%%/*}
          for pair in "bucket:$BUCKET_NAME" "distribution:$DISTRIBUTION_ID" \
                      "user pool:$USER_POOL_ID" "client:$USER_POOL_CLIENT_ID" \
                      "cognito domain:$COGNITO_DOMAIN"; do
            value=${pair#*:}
            if [[ -z "$value" || "$value" == "None" ]]; then
              echo "Error: missing stack output for ${pair%%:*}" >&2
              exit 1
            fi
          done
          {
            echo "bucket_name=$BUCKET_NAME"
            echo "distribution_id=$DISTRIBUTION_ID"
            echo "user_pool_id=$USER_POOL_ID"
            echo "user_pool_client_id=$USER_POOL_CLIENT_ID"
            echo "cognito_domain=$COGNITO_DOMAIN"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Build and deploy the frontend to dev. Push-only, needs setup.
  # ---------------------------------------------------------------------------
  deploy-frontend:
    name: Deploy frontend (dev)
    needs: setup
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Frontend-${{ github.run_id }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Create environment file
        # Mirrors infra/scripts/deploy.sh --frontend (the canonical source). dev has
        # enableCustomDomain=true and enableGoogleAuth=true; keep these in sync with
        # infra/config/environments.ts if the dev flags ever change.
        run: |
          cat > frontend/.env << EOF
          NUXT_PUBLIC_API_BASE_URL=https://api.dev.whiskeybar.site
          NUXT_PUBLIC_USER_POOL_ID=${{ needs.setup.outputs.user_pool_id }}
          NUXT_PUBLIC_USER_POOL_CLIENT_ID=${{ needs.setup.outputs.user_pool_client_id }}
          NUXT_PUBLIC_REGION=${{ env.AWS_REGION }}
          NUXT_PUBLIC_COGNITO_DOMAIN=${{ needs.setup.outputs.cognito_domain }}
          NUXT_PUBLIC_GOOGLE_AUTH_ENABLED=1
          NUXT_PUBLIC_ENVIRONMENT=dev
          EOF

      - name: Build frontend (generate)
        run: env -u NUXT_PUBLIC_MOCK_AUTH NODE_ENV=production npm run generate
        working-directory: frontend

      - name: Deploy to S3
        run: aws s3 sync frontend/.output/public "s3://${{ needs.setup.outputs.bucket_name }}" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ needs.setup.outputs.distribution_id }}" \
            --paths "/*"

  notify:
    name: Deployment summary
    needs: [ci, setup, deploy-frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report status
        run: |
          echo "=== Summary ==="
          echo "CI:               ${{ needs.ci.result }}"
          echo "Setup (dev):      ${{ needs.setup.result }}"
          echo "Frontend (dev):   ${{ needs.deploy-frontend.result }}"
