version: 2
updates:
  # Keep the SHA-pinned GitHub Actions in .github/workflows current via reviewable PRs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  # Frontend (Nuxt) npm dependencies.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types:
          - minor
          - patch

  # Infrastructure (CDK) npm dependencies.
  - package-ecosystem: npm
    directory: /infra
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      infra-minor-patch:
        update-types:
          - minor
          - patch

  # Python tooling, test dependencies, and the Lambda runtime dependencies.
  # The Lambda directories share this entry (and its group) on purpose: the
  # test pins in requirements-dev.txt / local_api mirror the Lambda runtime
  # pins, so one grouped PR must bump both sides together.
  # tests/test_requirements_parity.py fails CI if they drift apart.
  # Add new Lambda directories that ship a requirements.txt here.
  - package-ecosystem: pip
    directories:
      - /
      - /lambda/drink-logs
      - /lambda/drink-log-analyze
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major updates need a group too: an ungrouped update becomes one PR per
    # directory, and each of those fails the parity test on its own.
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch
      python-major:
        update-types:
          - major
    ignore:
      # The python3.11 Lambda runtime is Amazon Linux 2 (glibc 2.26). Pillow
      # 12.3.0 and later ship no manylinux2014 wheel for cp311, so they would
      # not install there (see #100). Lift this when the Lambdas move to
      # python3.12 or later (Amazon Linux 2023).
      - dependency-name: pillow
        versions:
          - ">=12.3.0"
