version: 2
updates:
  # Keep the SHA-pinned GitHub Actions in .github/workflows current via reviewable PRs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  # Frontend (Nuxt) npm dependencies.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types:
          - minor
          - patch

  # Infrastructure (CDK) npm dependencies.
  - package-ecosystem: npm
    directory: /infra
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      infra-minor-patch:
        update-types:
          - minor
          - patch

  # Python tooling, test dependencies, and the Lambda runtime dependencies.
  # The Lambda directories share this entry (and its group) on purpose: the
  # test pins in requirements-dev.txt / local_api mirror the Lambda runtime
  # pins, so one grouped PR must bump both sides together.
  # tests/test_requirements_parity.py fails CI if they drift apart.
  # Add new Lambda directories that ship a requirements.txt here.
  - package-ecosystem: pip
    directories:
      - /
      - /lambda/drink-logs
      - /lambda/drink-log-analyze
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch
